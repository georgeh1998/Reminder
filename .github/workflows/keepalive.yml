name: Keepalive

# スケジュール実行のワークフローは、リポジトリに60日間アクティビティがないと自動で無効化される。
# それを防ぐため、毎月1日に keepalive.txt の日付を更新して main に直接コミットする。

on:
  schedule:
    - cron: "0 0 1 * *"  # UTC 00:00 = JST 09:00, 毎月1日
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update keepalive.txt
        run: TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST' > keepalive.txt
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keepalive.txt
          git commit -m "chore: keepalive $(cat keepalive.txt)"
          git push
